name: ${COMPOSE_PROJECT_NAME:-qq-ai-bot}

x-common: &common
  restart: unless-stopped
  logging:
    driver: local
    options:
      max-size: 10m
      max-file: "3"

services:
  postgres:
    <<: *common
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qqbot}
      POSTGRES_DB: ${POSTGRES_DB:-qqbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run setup first}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    command: [postgres, -c, shared_buffers=64MB, -c, max_connections=30, -c, log_statement=none, -c, log_min_error_statement=panic]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [storage]
    mem_limit: 256m
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 15s
      timeout: 5s
      retries: 5

  redis:
    <<: *common
    image: ${REDIS_IMAGE:-redis:7.4-alpine}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run setup first}
    command: [sh, -c, 'exec redis-server --requirepass "$${REDIS_PASSWORD}" --appendonly yes --maxmemory 64mb --maxmemory-policy noeviction']
    volumes:
      - redis_data:/data
    networks: [storage]
    mem_limit: 128m
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli --no-auth-warning ping | grep -q PONG']
      interval: 15s
      timeout: 5s
      retries: 5

  bot:
    <<: *common
    image: qq-ai-bot-core:local
    build:
      context: .
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [storage, gateway]
    init: true
    read_only: true
    tmpfs: [/tmp:size=32m]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    stop_grace_period: 220s
    healthcheck:
      test: [CMD, python, scripts/healthcheck.py, --infrastructure]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  napcat:
    <<: *common
    image: qq-ai-bot-napcat:local
    build:
      context: .
      dockerfile: Dockerfile.napcat
      args:
        NAPCAT_IMAGE: ${NAPCAT_IMAGE:-mlikiowa/napcat-docker:latest}
    hostname: qq-client
    environment:
      NAPCAT_UID: ${NAPCAT_UID:-1000}
      NAPCAT_GID: ${NAPCAT_GID:-1000}
      ACCOUNT: ${NAPCAT_ACCOUNT:-}
    ports:
      - "127.0.0.1:6099:6099"
    volumes:
      - ./runtime/napcat/config:/app/napcat/config
      - napcat_qq:/app/.config/QQ
    tmpfs:
      - /app/napcat/logs:size=16m,mode=0700
    networks: [gateway]
    init: true
    mem_limit: 900m
    shm_size: 128m
    stop_grace_period: 30s
    # Upstream startup prints the WebUI token/QR URL; do not retain its stdout.
    logging: {driver: none}
    healthcheck:
      test: [CMD, curl, --fail, --silent, --show-error, --max-time, "5", --output, /dev/null, "http://127.0.0.1:6099/webui/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

networks:
  storage:
    internal: true
  gateway:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  napcat_qq:
